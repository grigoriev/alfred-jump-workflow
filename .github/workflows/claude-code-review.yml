---
# Claude reviews a pull request once, when it opens or becomes ready.
# Ask for a further round with an @claude comment, see claude.yml.
name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  claude-review:
    uses: grigoriev/workflows/.github/workflows/claude-review.yml@709ce4165ef786567f5055f61942ce3e9d34f658 # main
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

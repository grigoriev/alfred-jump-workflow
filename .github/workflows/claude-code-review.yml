---
# Claude reviews a pull request once, when it opens or becomes ready.
name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  claude-review:
    uses: grigoriev/workflows/.github/workflows/claude-review.yml@095f26d8f753183e940ca9a791ebd95956f88a26 # main
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

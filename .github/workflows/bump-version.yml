name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get current version
        id: current
        run: |
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('info.plist','rb'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          case "${{ inputs.bump_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "New version: ${major}.${minor}.${patch}"

      - name: Update version in info.plist
        run: |
          python3 -c "import plistlib; p='info.plist'; d=plistlib.load(open(p,'rb')); d['version']='${{ steps.new.outputs.version }}'; plistlib.dump(d, open(p,'wb'))"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add info.plist
          git commit -m "chore: bump version to ${{ steps.new.outputs.version }}"
          git tag "v${{ steps.new.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.new.outputs.version }}"

      - name: Summary
        run: |
          echo "## Release v${{ steps.new.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bumped from \`${{ steps.current.outputs.version }}\` to \`${{ steps.new.outputs.version }}\`. The release workflow builds and publishes the release." >> "$GITHUB_STEP_SUMMARY"

name: Bump Version & Release

# This file is the same in every Alfred workflow repository and in
# alfred-workflow-updater. What differs per repository lives in its Makefile:
# print-version and set-version.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The push uses PAT_TOKEN, so the job token only reads.
    permissions:
      contents: read

    steps:
      # ref: main, because the dispatch can start from any branch while the
      # steps below commit the new version and push it to main. Without it a
      # dispatch from a feature branch would publish that branch as main.
      #
      # persist-credentials: false, so no token is written into .git/config.
      # PAT_TOKEN reaches the one step that pushes, and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Get current version
        id: current
        run: |
          VERSION=$(make -s print-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          case "$BUMP_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "New version: ${major}.${minor}.${patch}"

      - name: Write the new version
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: make set-version VERSION="$NEW_VERSION"

      # The release workflow takes its notes from the section cut here.
      - name: Move the Unreleased entries of CHANGELOG.md into the release
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: .github/scripts/changelog-cut.sh "$NEW_VERSION"

      # PAT_TOKEN, not GITHUB_TOKEN: a tag pushed with the default token starts
      # no further workflow, so release.yml would never see this tag.
      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stages the version file and CHANGELOG.md, the only tracked changes.
          git add -u
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          # The token reaches git through GIT_ASKPASS, so the remote URL carries
          # no credential: a URL with the token stands in the command line of
          # the push and in what git prints when a push fails. The helper file
          # holds no secret either, it reads the one in the environment.
          # shellcheck disable=SC2016  # $PAT_TOKEN is read when the helper runs
          printf '#!/bin/sh\nexec echo "$PAT_TOKEN"\n' > "$RUNNER_TEMP/askpass.sh"
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          REMOTE="https://x-access-token@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" main
          git push "$REMOTE" "v$NEW_VERSION"

      - name: Summary
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          {
            echo "## Release v$NEW_VERSION"
            echo ""
            echo "Bumped from \`$CURRENT_VERSION\` to \`$NEW_VERSION\`. The release workflow builds and publishes the release."
          } >> "$GITHUB_STEP_SUMMARY"

name: Release

# This file is the same in every Alfred workflow repository and in
# alfred-workflow-updater. What differs per repository lives in its Makefile:
# set-version, build, print-release-files and print-provenance.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Releases are immutable: a published release keeps its files, so a rerun
      # cannot replace them. Stop here, before anything is built.
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME exists; immutable releases cannot be changed"
            exit 1
          fi

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before the build.
      - name: Read the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - name: Set version from tag
        run: make set-version VERSION="${GITHUB_REF_NAME#v}"

      # CHECK_PROVENANCE=1 verifies the build provenance of the shared updater
      # bundle with gh attestation verify before it goes into the release.
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make build CHECK_PROVENANCE=1

      - name: List the release files
        id: files
        run: |
          {
            echo "files<<EOF"
            make -s print-release-files
            echo "EOF"
            echo "provenance=$(make -s print-provenance)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.files }}

      # One call publishes the release with all its files. An immutable release
      # accepts no upload after that.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PROVENANCE: ${{ steps.files.outputs.provenance }}
        run: |
          cp "$BUNDLE" "$PROVENANCE"
          mapfile -t files < <(make -s print-release-files)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "$PROVENANCE" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

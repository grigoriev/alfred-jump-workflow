name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        run: plutil -replace version -string "${GITHUB_REF_NAME#v}" info.plist

      - name: Build Alfred Workflow
        run: make build

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Jump.alfredworkflow

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" Jump.alfredworkflow.intoto.jsonl
          gh release create "$GITHUB_REF_NAME" Jump.alfredworkflow Jump.alfredworkflow.intoto.jsonl --title "$GITHUB_REF_NAME" --generate-notes
